spring:
  application:
    name: repasse-api
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repasse}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

repasse:
  comissao:
    entrega-ifood: 0.27
    entrega-propria: 0.12
  pagamento:
    pix: 0.0099
    credito: 0.032
    debito: 0.020